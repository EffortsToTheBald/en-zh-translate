apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: translate-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nginx-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-svc
  namespace: translate-app
spec:
  selector:
    app: nginx-gateway
  ports:
    - port: 80
      targetPort: 80